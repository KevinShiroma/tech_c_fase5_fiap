name: Trigger auto deployment for sdr-imobiliario-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/sdr-imobiliario-app-AutoDeployTrigger-e416edcf-61b2-4ac9-9161-4edf79a08825.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SDRIMOBILIARIOAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SDRIMOBILIARIOAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SDRIMOBILIARIOAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ca86e9f46ab0acr.azurecr.io
          registryUsername: ${{ secrets.SDRIMOBILIARIOAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SDRIMOBILIARIOAPP_REGISTRY_PASSWORD }}
          containerAppName: sdr-imobiliario-app
          resourceGroup: rg-sdr-imobiliario
          imageToBuild: ca86e9f46ab0acr.azurecr.io/sdr-imobiliario-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


